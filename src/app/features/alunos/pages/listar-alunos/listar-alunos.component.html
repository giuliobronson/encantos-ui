<section class="listar-alunos">
    <h1>Alunos</h1>

    <app-table
        [elementData]="alunos"
        [displayedColumns]="alunoFields"
        [totalElements]="totalAlunos"
        (filter)="applyFilter($event)"
        (action)="openDialog($event)"
        (page)="loadAlunos($event)">
    </app-table>
</section>
