<h1 mat-dialog-title>Editar aluno</h1>
<div mat-dialog-content>
    <form class="form-grid" [formGroup]="form">
        <mat-form-field class="nome-field" appearance="fill">
            <mat-label>Nome Completo</mat-label>
            <input matInput formControlName="nome" />
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>CPF</mat-label>
            <input matInput formControlName="cpf" />
        </mat-form-field>

        <mat-form-field  appearance="fill">
            <mat-label>Data de Nascimento</mat-label>
            <input matInput [matDatepicker]="picker" formControlName="dataNascimento" name="data">
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
    </form>
</div>

<div mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancelar</button>
    <button mat-raised-button color="primary" (click)="onSubmit()">Enviar</button>
</div>
